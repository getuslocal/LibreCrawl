# ===========================================================================
# REFERENCE ONLY — NOT ACTIVE
# ===========================================================================
# This file is preserved as a historical reference for the layered-override
# approach we initially attempted. It is NOT used by Portainer's Git stack
# (Portainer does not auto-merge docker-compose.override.yml).
#
# Renamed from docker-compose.override.yml → .example.yml to prevent native
# `docker compose` from accidentally merging it on top of the now-merged
# canonical docker-compose.yml.
#
# Canonical config lives in docker-compose.yml.
# ===========================================================================

services:
  librecrawl:
    container_name: librecrawl
    volumes:
      - librecrawl_data:/app/data
    environment:
      - LOCAL_MODE=false
      - REGISTRATION_DISABLED=false
      - DEMO_MODE=false
      - DANGEROUSLY_SKIP_AUTH=false
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.librecrawl.rule=Host(`crawl.sybserver.com`)"
      - "traefik.http.routers.librecrawl.entrypoints=web"
      - "traefik.http.services.librecrawl.loadbalancer.server.port=5000"

volumes:
  librecrawl_data:

networks:
  traefik:
    external: true
