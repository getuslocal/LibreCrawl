# SYB customization — adds Traefik routing for netcup deployment.
# Upstream docker-compose.yml ports block removed (we don't bind host ports
# behind Cloudflared+Traefik). Traefik routes via the `traefik` Docker network.
# Data persisted via named Docker volume to avoid host bind-mount UID issues
# (container runs as UID 1000:1000).

services:
  librecrawl:
    container_name: librecrawl
    volumes:
      - librecrawl_data:/app/data
    environment:
      - LOCAL_MODE=false
      - REGISTRATION_DISABLED=false
      - DEMO_MODE=false
      - DANGEROUSLY_SKIP_AUTH=false
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.librecrawl.rule=Host(`crawl.sybserver.com`)"
      - "traefik.http.routers.librecrawl.entrypoints=web"
      - "traefik.http.services.librecrawl.loadbalancer.server.port=5000"

volumes:
  librecrawl_data:

networks:
  traefik:
    external: true
