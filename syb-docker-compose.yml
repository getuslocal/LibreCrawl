# SYB canonical compose for LibreCrawl on netcup — ROOT copy for Arcane.
# Root placement so build context = . (repo root, next to Dockerfile) and Arcane syncs all files.
services:
  librecrawl:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    container_name: librecrawl
    volumes:
      - /root/apps/librecrawl/data:/app/data
    environment:
      - FLASK_APP=main.py
      - PYTHONUNBUFFERED=1
      - SECRET_KEY=${SECRET_KEY}
      - LOCAL_MODE=${LOCAL_MODE:-false}
      - REGISTRATION_DISABLED=${REGISTRATION_DISABLED:-false}
      - DEMO_MODE=${DEMO_MODE:-false}
      - DANGEROUSLY_SKIP_AUTH=${DANGEROUSLY_SKIP_AUTH:-false}
    restart: unless-stopped
    shm_size: '2gb'
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.librecrawl.rule=Host(`crawl.sybserver.com`)"
      - "traefik.http.routers.librecrawl.entrypoints=web"
      - "traefik.http.routers.librecrawl.priority=1"
      - "traefik.http.routers.librecrawl.service=librecrawl"
      - "traefik.http.routers.librecrawl-api.rule=Host(`crawl.sybserver.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.librecrawl-api.entrypoints=web"
      - "traefik.http.routers.librecrawl-api.priority=100"
      - "traefik.http.routers.librecrawl-api.service=librecrawl"
      - "traefik.http.services.librecrawl.loadbalancer.server.port=5000"
    command: python main.py

networks:
  traefik:
    external: true
