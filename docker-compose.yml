# SYB-customized for netcup deployment behind Cloudflared + Traefik.
# Diverges from upstream in: ports removed, volume → named, env defaults flipped
# for production mode, traefik network + labels added.
#
# NOTE: docker-compose.override.example.yml in this repo is REFERENCE ONLY —
# Portainer Git stacks do not auto-merge override files. All real config lives here.

services:
  librecrawl:
    build: .
    container_name: librecrawl
    volumes:
      - librecrawl_data:/app/data
    environment:
      - FLASK_APP=main.py
      - PYTHONUNBUFFERED=1
      - LOCAL_MODE=${LOCAL_MODE:-false}
      - REGISTRATION_DISABLED=${REGISTRATION_DISABLED:-false}
      - DEMO_MODE=${DEMO_MODE:-false}
      - DANGEROUSLY_SKIP_AUTH=${DANGEROUSLY_SKIP_AUTH:-false}
      # SMTP (uncomment to enable email verification):
      # - SMTP_HOST=${SMTP_HOST}
      # - SMTP_PORT=${SMTP_PORT}
      # - SMTP_USER=${SMTP_USER}
      # - SMTP_PASSWORD=${SMTP_PASSWORD}
      # - SMTP_FROM=${SMTP_FROM}
      # - SMTP_FROM_NAME=${SMTP_FROM_NAME}
      # - MAIN_APP_URL=${MAIN_APP_URL}
    restart: unless-stopped
    shm_size: '2gb'
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.librecrawl.rule=Host(`crawl.sybserver.com`)"
      - "traefik.http.routers.librecrawl.entrypoints=web"
      - "traefik.http.services.librecrawl.loadbalancer.server.port=5000"
    command: >
      sh -c "
      FLAGS='';
      if [ \"$$LOCAL_MODE\" = \"true\" ]; then
        FLAGS=\"$$FLAGS --local\";
      fi;
      if [ \"$$REGISTRATION_DISABLED\" = \"true\" ]; then
        FLAGS=\"$$FLAGS --disable-register\";
      fi;
      if [ \"$$DEMO_MODE\" = \"true\" ]; then
        FLAGS=\"$$FLAGS --demo\";
      fi;
      if [ \"$$DANGEROUSLY_SKIP_AUTH\" = \"true\" ]; then
        FLAGS=\"$$FLAGS --dangerously-skip-auth\";
      fi;
      python main.py $$FLAGS"

volumes:
  librecrawl_data:

networks:
  traefik:
    external: true
